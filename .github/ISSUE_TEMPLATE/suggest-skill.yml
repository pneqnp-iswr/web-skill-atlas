name: Suggest a skill
description: Propose a new skill or canonical source
title: "skill: "
labels: [candidate]
body:
  - type: input
    id: url
    attributes: {label: Source URL}
    validations: {required: true}
  - type: input
    id: category
    attributes: {label: Suggested category}
  - type: textarea
    id: reason
    attributes: {label: Why it belongs in the catalog}
    validations: {required: true}
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for duplicates.
          required: true
        - label: This is a reusable workflow/ruleset, not merely a library.
          required: true
