name: Report a data problem
about: Report a broken source, duplicate, metadata error, taxonomy issue, or license concern.
title: "[data] "
labels: ["metadata"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Problem type
      options:
        - Broken or redirected source
        - Duplicate or mirror
        - Incorrect metadata
        - Taxonomy or category issue
        - License or attribution concern
        - Other
    validations:
      required: true
  - type: input
    id: entry
    attributes:
      label: Entry or source
      placeholder: Skill slug, name, or URL
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What should change?
      description: Include enough evidence to reproduce or verify the problem.
    validations:
      required: true
