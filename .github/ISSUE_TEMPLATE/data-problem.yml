name: Data problem
description: Broken link, duplicate, classification, metadata or license issue
title: "data: "
labels: [data]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Problem type
      options: [Broken link, Duplicate, Incorrect classification, Metadata correction, Copyright or license, Deprecated or archived, Suggested category, Security concern]
    validations: {required: true}
  - type: input
    id: skill
    attributes: {label: Skill slug or URL}
  - type: textarea
    id: evidence
    attributes: {label: Evidence / correction}
    validations: {required: true}
