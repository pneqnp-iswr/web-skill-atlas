name: link-check
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_links.py --retries 2
