name: frontend-research-import

on:
  push:
    branches:
      - research/frontend-deep-pass-2026-08-27
    paths:
      - research/frontend-2026-08-27/import.json

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/frontend-deep-pass-2026-08-27
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Merge verified frontend research
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          ROOT = Path('.')
          payload_path = ROOT / 'research/frontend-2026-08-27/import.json'
          payload = json.loads(payload_path.read_text(encoding='utf-8'))

          def load(path):
              return json.loads((ROOT / path).read_text(encoding='utf-8'))

          def dump(path, value):
              p = ROOT / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          skills = load('data/skills.json')
          categories = load('data/categories.json')
          sources = load('data/sources.json')
          rejected = load('data/rejected.json')

          # Apply provenance/status corrections only to exact existing names.
          by_name = {s['name']: s for s in skills}
          corrected = []
          for correction in payload.get('corrections', []):
              name = correction['match_name']
              if name not in by_name:
                  raise SystemExit(f'Correction target not found: {name}')
              by_name[name].update(correction['updates'])
              corrected.append(name)

          # Extend granular taxonomy without duplicating labels.
          category_by_name = {c['name']: c for c in categories}
          for category_name, subcats in payload.get('category_subcategories', {}).items():
              if category_name not in category_by_name:
                  raise SystemExit(f'Unknown top-level category in payload: {category_name}')
              current = category_by_name[category_name].setdefault('subcategories', [])
              for subcat in subcats:
                  if subcat not in current:
                      current.append(subcat)
              current.sort(key=str.casefold)

          existing_slugs = {s['slug'] for s in skills}
          existing_sources = {s.get('source_url') for s in skills}
          existing_names = {s['name'].casefold() for s in skills}
          id_nums = []
          for skill in skills:
              m = re.fullmatch(r'webskill-(\d+)', skill.get('id', ''))
              if m:
                  id_nums.append(int(m.group(1)))
          next_id = max(id_nums, default=0) + 1

          accepted = []
          skipped = []
          for candidate in payload.get('skills', []):
              slug = candidate['slug']
              src = candidate['source_url']
              name_key = candidate['name'].casefold()
              if slug in existing_slugs or src in existing_sources or name_key in existing_names:
                  skipped.append(candidate['name'])
                  continue
              item = dict(candidate)
              item['id'] = f'webskill-{next_id:04d}'
              next_id += 1
              skills.append(item)
              accepted.append(item)
              existing_slugs.add(slug)
              existing_sources.add(src)
              existing_names.add(name_key)

          source_urls = {s.get('url') for s in sources}
          appended_sources = []
          for source in payload.get('sources', []):
              if source['url'] not in source_urls:
                  sources.append(source)
                  appended_sources.append(source)
                  source_urls.add(source['url'])

          rejected_keys = {(r.get('name'), r.get('source_url')) for r in rejected}
          appended_rejected = []
          for entry in payload.get('rejected', []):
              key = (entry.get('name'), entry.get('source_url'))
              if key not in rejected_keys:
                  rejected.append(entry)
                  appended_rejected.append(entry)
                  rejected_keys.add(key)

          dump('data/skills.json', skills)
          dump('data/categories.json', categories)
          dump('data/sources.json', sources)
          dump('data/rejected.json', rejected)

          research_dir = ROOT / 'research/frontend-2026-08-27'
          research_dir.mkdir(parents=True, exist_ok=True)
          dump('research/frontend-2026-08-27/frontend-skills.json', accepted)
          dump('research/frontend-2026-08-27/frontend-sources.json', appended_sources)
          dump('research/frontend-2026-08-27/frontend-rejected.json', appended_rejected)
          dump('research/frontend-2026-08-27/frontend-derived-workflow-opportunities.json', payload.get('derived_workflow_opportunities', []))

          stats = payload['stats']
          stats['accepted_after_dedupe'] = len(accepted)
          stats['duplicates_skipped_at_import'] = len(skipped)
          stats['metadata_corrections'] = len(corrected)
          stats['frontend_count_after'] = stats['frontend_count_before'] + sum(1 for s in accepted if s['category'] == 'Frontend')
          stats['verified_new'] = sum(1 for s in accepted if s['status'] == 'verified')
          stats['partially_verified_new'] = sum(1 for s in accepted if s['status'] == 'partially-verified')
          dump('research/frontend-2026-08-27/frontend-import-stats.json', stats)

          log = payload['research_log'].rstrip() + '\n\n'
          (research_dir / 'frontend-research-log.md').write_text(log, encoding='utf-8')
          (research_dir / 'frontend-gaps.md').write_text(payload['gaps'].rstrip() + '\n', encoding='utf-8')

          top = sorted(accepted, key=lambda s: (-s['quality_score'], s['name'].casefold()))[:50]
          lines = [
              '# Frontend deep research summary',
              '',
              f"- Candidates reviewed: {stats['candidates_reviewed']}",
              f"- New accepted: {len(accepted)}",
              f"- Import-time duplicates skipped: {len(skipped)}",
              f"- Metadata corrections: {len(corrected)}",
              f"- Frontend count: {stats['frontend_count_before']} → {stats['frontend_count_after']}",
              f"- New verified: {stats['verified_new']}",
              f"- New partially verified: {stats['partially_verified_new']}",
              '',
              '## Top accepted skills',
              '',
          ]
          for s in top:
              lines.append(f"- **{s['name']}** — {s['category']} / {s['subcategory']} — {s['quality_score']} — {s['status']}")
          lines += ['', '## Import-time skips', ''] + [f'- {x}' for x in skipped]
          (research_dir / 'frontend-summary.md').write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')

          # Append concise pass markers to project-wide logs exactly once.
          marker = '## 2026-08-27 Frontend deep research pass'
          global_log = ROOT / 'docs/research-log.md'
          text = global_log.read_text(encoding='utf-8')
          if marker not in text:
              text = text.rstrip() + '\n\n' + marker + '\n\n' + payload['project_log_append'].strip() + '\n'
              global_log.write_text(text, encoding='utf-8')

          gaps_file = ROOT / 'docs/gaps.md'
          text = gaps_file.read_text(encoding='utf-8')
          if marker not in text:
              text = text.rstrip() + '\n\n' + marker + '\n\n' + payload['project_gaps_append'].strip() + '\n'
              gaps_file.write_text(text, encoding='utf-8')

          print(json.dumps({
              'accepted': len(accepted),
              'skipped': skipped,
              'corrected': corrected,
              'new_sources': len(appended_sources),
              'new_rejected': len(appended_rejected),
          }, indent=2))
          PY
      - name: Validate and generate deterministically
        run: |
          python scripts/validate.py
          python scripts/deduplicate.py
          python scripts/generate.py
          git diff > /tmp/generate-pass-1.diff
          python scripts/generate.py
          git diff > /tmp/generate-pass-2.diff
          cmp /tmp/generate-pass-1.diff /tmp/generate-pass-2.diff
          python scripts/validate.py
          python scripts/deduplicate.py
          python scripts/validate_issue_forms.py
          python scripts/scan_secrets.py
      - name: Commit synchronized atlas
        run: |
          git config user.name "web-skill-atlas research bot"
          git config user.email "actions@users.noreply.github.com"
          git add data README.md categories docs research/frontend-2026-08-27
          git commit -m "research(frontend): import verified deep-pass skills"
          git push origin HEAD:research/frontend-deep-pass-2026-08-27
          git diff --exit-code
