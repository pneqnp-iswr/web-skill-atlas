name: generated-data
on:
  workflow_dispatch:
  schedule:
    - cron: '31 4 * * 1'
jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/generate.py
      - run: git diff --exit-code
